name: Compose images and bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing published stable tag containing Compose support"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compose-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      repository: ${{ steps.identity.outputs.repository }}
      reuse: ${{ steps.images.outputs.reuse }}
      amd64: ${{ steps.images.outputs.amd64 }}
      arm64: ${{ steps.images.outputs.arm64 }}
    steps:
      - name: Validate explicit stable tag
        env:
          TAG: ${{ inputs.release_tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify published release and exact version
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -f packaging/compose-release.json
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = false
          python3 .github/scripts/release_metadata.py --tag "$TAG"
          mkdir -p build/source-assets
          gh release download "$TAG" --pattern "TG2Cloud-${TAG}-source.tar.gz" --pattern SHA256SUMS.txt --dir build/source-assets
          python3 .github/scripts/source_release.py verify --tag "$TAG" --directory build/source-assets
          commit="$(git rev-parse HEAD)"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$commit"
          printf 'tag=%s\ncommit=%s\nversion=%s\nrepository=ghcr.io/%s/tg2cloud\n' "$TAG" "$commit" "${TAG#v}" "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout the immutable workflow publisher (not business sources)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: build/publication-tools
      - name: Inspect an existing version before deciding to build
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.identity.outputs.repository }}:${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: python3 build/publication-tools/.github/scripts/compose_release.py inspect-index --image "$IMAGE" --commit "$COMMIT" --github-output "$GITHUB_OUTPUT"

  native-images:
    needs: prepare
    if: needs.prepare.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PYTHONPATH: src
      REPOSITORY: ${{ needs.prepare.outputs.repository }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Build the same core on the native runner
        run: |
          set -euo pipefail
          python3 .github/scripts/check_native_architecture.py --expected '${{ matrix.arch }}'
          python3 .github/scripts/build_payload.py --edition clouddrive2 --directory build/image-context
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${COMMIT}" --label "org.opencontainers.image.version=${VERSION}" -t tg2cloud-bot:test build/image-context
      - name: Test direct Compose setup and non-root configuration for both Editions
        env:
          TG2CLOUD_TEST_COMPOSE_DOCKER: '1'
        run: python3 -B -m unittest discover -s tests -p test_compose_docker.py -v
      - name: Validate the offline HTTPS host launcher without Bot dependencies
        env:
          PYTHONPATH: src
        run: python3 -B -m unittest discover -s tests -p test_compose_https_bundle.py -v
      - name: Push the validated native image under a commit-specific staging tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="${REPOSITORY}:sha-${COMMIT}-${{ matrix.arch }}"
          docker tag tg2cloud-bot:test "$image"
          docker push "$image"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          digest="${digest##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p build/digests
          printf '%s' "$digest" > 'build/digests/${{ matrix.arch }}.txt'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-image-${{ matrix.arch }}
          path: build/digests/*.txt
          if-no-files-found: error

  publish:
    needs: [prepare, native-images]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.native-images.result == 'success' ||
       (needs.native-images.result == 'skipped' && needs.prepare.outputs.reuse == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      PYTHONPATH: src
      TAG: ${{ needs.prepare.outputs.tag }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      REPOSITORY: ${{ needs.prepare.outputs.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Checkout the same immutable workflow publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: build/publication-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.reuse != 'true'
        with:
          pattern: compose-image-*
          merge-multiple: true
          path: build/digests
      - name: Reuse only the verified existing native digests
        if: needs.prepare.outputs.reuse == 'true'
        env:
          AMD64: ${{ needs.prepare.outputs.amd64 }}
          ARM64: ${{ needs.prepare.outputs.arm64 }}
        run: |
          set -euo pipefail
          [[ "$AMD64" =~ ^sha256:[0-9a-f]{64}$ && "$ARM64" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p build/digests
          printf '%s' "$AMD64" > build/digests/amd64.txt
          printf '%s' "$ARM64" > build/digests/arm64.txt
      - name: Recheck the remote tag before publication
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/tg2cloud-compose-release-check"
          test "$(git rev-parse 'refs/tags/tg2cloud-compose-release-check^{commit}')" = "$COMMIT"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = false
      - name: Publish or verify the immutable version index
        id: index
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 build/publication-tools/.github/scripts/compose_release.py publish-index --image "${REPOSITORY}:${VERSION}" --commit "$COMMIT" --amd64 "$(cat build/digests/amd64.txt)" --arm64 "$(cat build/digests/arm64.txt)" --github-output "$GITHUB_OUTPUT"
      - name: Verify anonymous pull access before publishing user bundles
        env:
          GH_TOKEN: ''
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('compose_release', Path('build/publication-tools/.github/scripts/compose_release.py'))
          tool = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tool)
          assert tool.inspect_index(os.environ['REPOSITORY'] + ':' + os.environ['VERSION'], os.environ['COMMIT'])['reuse'] == 'true'
          PY
      - name: Build digest-pinned deployment assets
        env:
          IMAGE: ${{ steps.index.outputs.image }}
        run: python3 .github/scripts/compose_release.py bundle --directory build/compose-release --image "$IMAGE" --commit "$COMMIT"
      - name: Add assets without replacing source archives or existing bundles
        run: |
          set -euo pipefail
          mkdir -p build/existing-assets
          gh release view "$TAG" --json assets --jq '.assets[].name' > build/asset-names.txt
          for file in build/compose-release/*.tar.gz build/compose-release/COMPOSE-SHA256SUMS.txt; do
            name="${file##*/}"
            if grep -Fxq "$name" build/asset-names.txt; then
              gh release download "$TAG" --pattern "$name" --dir build/existing-assets
              cmp "$file" "build/existing-assets/$name"
            else
              gh release upload "$TAG" "$file"
            fi
          done
