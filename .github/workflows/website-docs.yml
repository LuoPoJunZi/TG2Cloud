name: website-docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "assets/brand/**"
      - "docs/**"
      - "README.md"
      - "README_EN.md"
      - "payload_clouddrive2/app/version.py"
      - ".github/workflows/website-docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "website/**"
      - "assets/brand/**"
      - "docs/**"
      - "README.md"
      - "README_EN.md"
      - "payload_clouddrive2/app/version.py"
      - ".github/workflows/website-docs.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test and check links
        run: npm test
