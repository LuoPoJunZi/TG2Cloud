name: Actions history cleanup

on:
  workflow_run:
    workflows: ["Compose images and bundles"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; disable explicitly to remove eligible completed runs"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: actions-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'LuoPoJunZi/TG2Cloud' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted maintenance code from this workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up maintenance Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Preserve recent and critical runs, then verify the result
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" != true ]]; then
            args+=(--apply)
          fi
          python3 -B .github/scripts/cleanup_actions.py "${args[@]}"
      - name: Save cleanup inventory and per-run audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-cleanup-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/actions-cleanup/
          retention-days: 30
          if-no-files-found: warn
