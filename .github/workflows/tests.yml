name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "website/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "website/**"

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  linux-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck rclone
          shellcheck -x \
            packaging/hooks/clouddrive2/backup_retention.sh \
            packaging/hooks/clouddrive2/preserve_runtime_config.sh \
            packaging/hooks/clouddrive2/remote_install.sh \
            packaging/hooks/clouddrive2/repair_clouddrive_network.sh \
            packaging/hooks/clouddrive2/manage.sh \
            packaging/hooks/openlist/remote_install.sh \
            packaging/hooks/openlist/manage.sh \
            packaging/hooks/openlist/openlist_admin.sh \
            packaging/hooks/openlist/preserve_webdav_config.sh \
            tests/manage_harness.sh \
            tests/maintenance_docker_stub.sh

      - name: Set up runtime Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Linux runtime regression and real WebDAV integration
        run: |
          python -m pip install -r requirements/dev.lock.txt
          python .github/scripts/check_python.py test

      - name: Python quality, syntax, version and dependency audit
        run: |
          python .github/scripts/check_python.py lint
          python .github/scripts/check_python.py compile
          python .github/scripts/release_metadata.py
          python .github/scripts/prepare_bootstrap.py
          python -m bandit -q -r src scripts .github/scripts/source_release.py
          python -m pip_audit -r requirements/bot.lock.txt
          python -m pip_audit -r requirements/dev.lock.txt

      - name: Validate Compose
        run: |
          python .github/scripts/build_payload.py --edition all --directory build/ci-contexts
          touch build/ci-contexts/clouddrive2/.env
          docker compose -f build/ci-contexts/clouddrive2/docker-compose.yml config --quiet
          cp build/ci-contexts/clouddrive2/.env build/ci-contexts/openlist/.env
          OPENLIST_ADMIN_PASSWORD=ci-only-placeholder docker compose -f build/ci-contexts/openlist/docker-compose.yml config --quiet

      - name: Build Linux Bot image
        run: docker build -t tg2cloud-bot:test build/ci-contexts/clouddrive2

      - name: Run both Edition candidate images as non-root
        timeout-minutes: 20
        env:
          TG2CLOUD_TEST_DOCKER: "1"
        run: python -m unittest discover -s tests -p test_runtime_namespace.py -v
