name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Unit and scenario tests
        run: >
          uv run
          --with-requirements requirements-build.txt
          --with-requirements payload_clouddrive2/requirements.txt
          python -m unittest discover -s tests -v

      - name: Ruff
        run: uv run --with ruff==0.16.0 ruff check installer.py installer_clouddrive2.py installer_openlist.py deployer_products.py vps_resources.py payload_clouddrive2/app tests

      - name: Bandit
        run: uv run --with bandit==1.9.4 bandit -q -r payload_clouddrive2/app installer.py installer_clouddrive2.py installer_openlist.py deployer_products.py vps_resources.py

      - name: Dependency audit
        run: |
          uv run --with pip-audit==2.10.1 pip-audit -r payload_clouddrive2/requirements.txt
          uv run --with pip-audit==2.10.1 pip-audit -r requirements-build.txt

      - name: Build and self-test Windows EXE
        timeout-minutes: 20
        shell: pwsh
        run: |
          $env:TG115_BUILD_PYTHON = (Get-Command python -ErrorAction Stop).Source
          python --version
          ./build.ps1
          foreach ($product in @("CloudDrive2", "OpenList")) {
            $result = Join-Path $env:RUNNER_TEMP "tg115-$($product.ToLower())-self-test.txt"
            $process = Start-Process `
              -FilePath "./dist/TG115-$product-Deployer.exe" `
              -ArgumentList @("--self-test", "--self-test-result", $result) `
              -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(120000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "$product EXE self-test timed out after 120 seconds"
            }
            if ($process.ExitCode -ne 0) {
              throw "$product EXE self-test exited with $($process.ExitCode)"
            }
            $content = Get-Content -LiteralPath $result -Raw -Encoding utf8
            if ($content -notmatch "result=OK") {
              throw "$product EXE self-test did not report OK"
            }
          }

  linux-products:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck rclone
          shellcheck \
            payload_clouddrive2/backup_retention.sh \
            payload_clouddrive2/remote_install.sh \
            payload_clouddrive2/repair_clouddrive_network.sh \
            payload_clouddrive2/manage.sh \
            payload_openlist/remote_install.sh \
            payload_openlist/manage.sh \
            payload_openlist/openlist_admin.sh \
            payload_openlist/preserve_webdav_config.sh

      - name: Set up runtime Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Linux runtime regression and real WebDAV integration
        run: |
          python -m pip install -r requirements-build.txt -r payload_clouddrive2/requirements.txt
          python -m unittest discover -s tests -v

      - name: Validate Compose
        run: |
          touch payload_clouddrive2/.env
          docker compose -f payload_clouddrive2/docker-compose.yml config --quiet
          cp payload_clouddrive2/.env payload_openlist/.env
          OPENLIST_ADMIN_PASSWORD=ci-only-placeholder docker compose -f payload_openlist/docker-compose.yml config --quiet

      - name: Build Linux Bot image
        run: docker build -t tg115-bot:test payload_clouddrive2
