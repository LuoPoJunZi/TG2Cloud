name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "website/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "website/**"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Unit and scenario tests
        run: >
          uv run
          --with-requirements payload_clouddrive2/requirements.txt
          python .github/scripts/check_python.py test

      - name: Ruff
        run: uv run --with ruff==0.16.0 python .github/scripts/check_python.py lint

      - name: Python syntax
        run: python .github/scripts/check_python.py compile

      - name: Bandit
        run: uv run --with bandit==1.9.4 bandit -q -r payload_clouddrive2/app scripts .github/scripts/release_metadata.py .github/scripts/source_release.py

      - name: Validate script version source
        run: python .github/scripts/release_metadata.py

      - name: Dependency audit
        run: |
          uv run --with pip-audit==2.10.1 pip-audit -r payload_clouddrive2/requirements.txt

  linux-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck rclone
          shellcheck -x \
            payload_clouddrive2/backup_retention.sh \
            payload_clouddrive2/preserve_runtime_config.sh \
            payload_clouddrive2/remote_install.sh \
            payload_clouddrive2/repair_clouddrive_network.sh \
            payload_clouddrive2/manage.sh \
            payload_openlist/remote_install.sh \
            payload_openlist/manage.sh \
            payload_openlist/openlist_admin.sh \
            payload_openlist/preserve_webdav_config.sh \
            tests/manage_harness.sh \
            tests/maintenance_docker_stub.sh

      - name: Set up runtime Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Linux runtime regression and real WebDAV integration
        run: |
          python -m pip install -r payload_clouddrive2/requirements.txt
          python .github/scripts/check_python.py test

      - name: Validate Compose
        run: |
          touch payload_clouddrive2/.env
          docker compose -f payload_clouddrive2/docker-compose.yml config --quiet
          cp payload_clouddrive2/.env payload_openlist/.env
          OPENLIST_ADMIN_PASSWORD=ci-only-placeholder docker compose -f payload_openlist/docker-compose.yml config --quiet

      - name: Build Linux Bot image
        run: docker build -t tg2cloud-bot:test payload_clouddrive2

      - name: Run both Edition candidate images as non-root
        timeout-minutes: 20
        env:
          TG2CLOUD_TEST_DOCKER: "1"
        run: python -m unittest discover -s tests -p test_runtime_namespace.py -v
