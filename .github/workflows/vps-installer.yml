name: VPS installer checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install-lan.sh"
      - "uninstall.sh"
      - "scripts/**"
      - "src/**"
      - "pyproject.toml"
      - "requirements/**"
      - "tests/test_vps_installer.py"
      - "tests/test_lan*.py"
      - "tests/test_uninstaller.py"
      - "tests/test_proxy_host_compat.py"
      - "tests/test_repository.py"
      - "tests/test_storage_wizard.py"
      - "tests/test_source_release.py"
      - ".github/scripts/source_release.py"
      - ".github/scripts/check_python.py"
      - ".github/scripts/check_repository.py"
      - ".ruff.toml"
      - "packaging/**"
      - ".github/workflows/vps-installer.yml"
  pull_request:
    branches: [main]
    paths:
      - "install.sh"
      - "install-lan.sh"
      - "uninstall.sh"
      - "scripts/**"
      - "src/**"
      - "pyproject.toml"
      - "requirements/**"
      - "tests/test_vps_installer.py"
      - "tests/test_lan*.py"
      - "tests/test_uninstaller.py"
      - "tests/test_proxy_host_compat.py"
      - "tests/test_repository.py"
      - "tests/test_storage_wizard.py"
      - "tests/test_source_release.py"
      - ".github/scripts/source_release.py"
      - ".github/scripts/check_python.py"
      - ".github/scripts/check_repository.py"
      - ".ruff.toml"
      - "packaging/**"
      - ".github/workflows/vps-installer.yml"

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  offline-linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint tools only
        run: |
          python -m pip install ruff==0.16.0 bandit==1.9.4
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Shell syntax and lint
        run: |
          bash -n install.sh
          bash -n install-lan.sh
          bash -n uninstall.sh
          shellcheck install.sh install-lan.sh uninstall.sh
      - name: Offline tests (no VPS or Docker calls)
        run: |
          python .github/scripts/check_python.py test --scope cli
      - name: Isolated LAN Nginx checks (no product deployment)
        if: matrix.python == '3.13'
        env:
          TG2CLOUD_TEST_LAN_DOCKER: "1"
        run: python -B -m unittest discover -s tests -p test_lan_gateway_docker.py -v
      - name: Python lint and syntax
        run: |
          python .github/scripts/check_python.py lint --scope cli
          python .github/scripts/check_python.py compile --scope cli
          bandit -q -r scripts
      - name: Whitespace check
        run: git diff --check
