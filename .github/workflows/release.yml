name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.preflight.outputs.publish }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}
      release_artifact: ${{ steps.metadata.outputs.release_artifact }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
    steps:
      - name: Require a version tag (including manual dispatch)
        run: |
          set -euo pipefail
          test "${GITHUB_REF_TYPE}" = tag
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]

      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Validate tag, single version source, Windows resources and release documents
        id: metadata
        run: python3 .github/scripts/release_metadata.py --tag "${GITHUB_REF_NAME}" --github-output "${GITHUB_OUTPUT}"

      - name: Check immutable tag and release state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --silent
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing will be replaced."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate GitHub Release notes layout
        if: steps.preflight.outputs.publish == 'true'
        run: python3 .github/scripts/validate_release_notes.py RELEASE_NOTES.md

  windows-build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_ARTIFACT: ${{ needs.prepare.outputs.release_artifact }}
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked-out tag
        shell: pwsh
        run: |
          $tagCommit = (git rev-parse "$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne (git rev-parse HEAD).Trim()) {
            throw "Checked out commit does not match $env:RELEASE_TAG"
          }
          Write-Output "Release commit: $((git rev-parse HEAD).Trim())"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Unit and scenario tests
        run: >
          uv run
          --with-requirements requirements-build.txt
          --with-requirements payload_clouddrive2/requirements.txt
          python -m unittest discover -s tests -v

      - name: Ruff
        run: uv run --with ruff==0.16.0 ruff check installer.py installer_clouddrive2.py installer_openlist.py deployer_products.py domain_proxy.py operation_feedback.py proxy_maintenance.py .github/scripts/release_metadata.py vps_resources.py payload_clouddrive2/app tests

      - name: Build and self-test Windows EXE once
        timeout-minutes: 20
        shell: pwsh
        run: |
          $env:TG2CLOUD_BUILD_PYTHON = (Get-Command python -ErrorAction Stop).Source
          ./build.ps1 -Edition All

      - name: Generate and verify release package
        shell: pwsh
        run: |
          $expectedExe = @(
            "TG2Cloud-CloudDrive2-Deployer.exe",
            "TG2Cloud-OpenList-Deployer.exe"
          )
          $actualExe = @(
            Get-ChildItem -LiteralPath ./dist -File -Filter '*.exe' |
              Sort-Object Name |
              Select-Object -ExpandProperty Name
          )
          if (Compare-Object $expectedExe $actualExe) {
            throw "Unexpected EXE set: $($actualExe -join ', ')"
          }

          $hashLines = foreach ($name in $expectedExe) {
            $hash = (Get-FileHash -LiteralPath "./dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksumPath = Join-Path (Resolve-Path ./dist) 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText(
            $checksumPath,
            (($hashLines -join "`n") + "`n"),
            [System.Text.Encoding]::ASCII
          )

          $expectedAssets = @($expectedExe + 'SHA256SUMS.txt') | Sort-Object
          $actualAssets = @(
            Get-ChildItem -LiteralPath ./dist -File |
              Sort-Object Name |
              Select-Object -ExpandProperty Name
          )
          if (Compare-Object $expectedAssets $actualAssets) {
            throw "Unexpected release assets: $($actualAssets -join ', ')"
          }
          Get-Content -LiteralPath ./dist/SHA256SUMS.txt

      - name: Upload the GitHub-built release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: |
            dist/TG2Cloud-CloudDrive2-Deployer.exe
            dist/TG2Cloud-OpenList-Deployer.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux-validation:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout the same immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up runtime Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Linux validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck rclone
          python -m pip install -r requirements-build.txt -r payload_clouddrive2/requirements.txt

      - name: ShellCheck
        run: |
          shellcheck -x \
            payload_clouddrive2/backup_retention.sh \
            payload_clouddrive2/preserve_runtime_config.sh \
            payload_clouddrive2/remote_install.sh \
            payload_clouddrive2/repair_clouddrive_network.sh \
            payload_clouddrive2/manage.sh \
            payload_openlist/remote_install.sh \
            payload_openlist/manage.sh \
            payload_openlist/openlist_admin.sh \
            payload_openlist/preserve_webdav_config.sh \
            tests/manage_harness.sh \
            tests/maintenance_docker_stub.sh

      - name: Linux runtime, gateway and real WebDAV regression
        run: |
          command -v bash shellcheck rclone docker
          docker info >/dev/null
          python -m unittest discover -s tests -v

      - name: Validate edition Compose and build the runtime image
        run: |
          touch payload_clouddrive2/.env
          docker compose -f payload_clouddrive2/docker-compose.yml config --quiet
          cp payload_clouddrive2/.env payload_openlist/.env
          OPENLIST_ADMIN_PASSWORD=ci-only-placeholder docker compose -f payload_openlist/docker-compose.yml config --quiet
          docker build -t tg2cloud-bot:release-test payload_clouddrive2

  release:
    needs:
      - prepare
      - windows-build
      - linux-validation
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      needs.windows-build.result == 'success' &&
      needs.linux-validation.result == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
      RELEASE_ARTIFACT: ${{ needs.prepare.outputs.release_artifact }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
    steps:
      - name: Checkout release notes from the immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download the Windows Build Job artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release-assets

      - name: Verify downloaded package and SHA256
        run: |
          set -euo pipefail
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            SHA256SUMS.txt
            TG2Cloud-CloudDrive2-Deployer.exe
            TG2Cloud-OpenList-Deployer.exe
          )
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          (
            cd release-assets
            sha256sum --check SHA256SUMS.txt
          )

      - name: Create GitHub release from the same package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} appeared after preflight; refusing to replace it." >&2
            exit 1
          fi
          prerelease_args=()
          if [[ "${RELEASE_PRERELEASE}" == true ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            release-assets/TG2Cloud-CloudDrive2-Deployer.exe \
            release-assets/TG2Cloud-OpenList-Deployer.exe \
            release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${RELEASE_TITLE}" \
            --notes-file RELEASE_NOTES.md "${prerelease_args[@]}"

      - name: Verify published release and exact asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)" = "${RELEASE_TAG}"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json name --jq .name)" = "${RELEASE_TITLE}"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)" = "${RELEASE_PRERELEASE}"
          expected=(
            SHA256SUMS.txt
            TG2Cloud-CloudDrive2-Deployer.exe
            TG2Cloud-OpenList-Deployer.exe
          )
          mapfile -t actual < <(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' | sort
          )
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url
