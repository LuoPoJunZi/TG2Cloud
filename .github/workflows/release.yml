name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable version tag to publish (for example v1.3.0)"
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.preflight.outputs.publish }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_title: ${{ steps.metadata.outputs.release_title }}
      release_artifact: ${{ steps.metadata.outputs.release_artifact }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
    steps:
      - name: Resolve an existing version tag (including manual retry)
        id: target
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && -n "${REQUESTED_TAG}" ]]; then
            release_tag="${REQUESTED_TAG}"
          else
            echo "Select an existing version tag; branch publishing is not allowed." >&2
            exit 1
          fi
          [[ "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]
          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.target.outputs.release_tag }}
          fetch-depth: 0

      - name: Validate tag, version and release documents
        id: metadata
        env:
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: python3 .github/scripts/release_metadata.py --tag "${RELEASE_TAG}" --github-output "${GITHUB_OUTPUT}"

      - name: Check public repository inputs before packaging
        run: python3 -B .github/scripts/check_repository.py

      - name: Check immutable tag and release state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --silent
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing will be replaced."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate GitHub Release notes layout
        if: steps.preflight.outputs.publish == 'true'
        run: python3 .github/scripts/validate_release_notes.py RELEASE_NOTES.md

  linux-validation:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_ARTIFACT: ${{ needs.prepare.outputs.release_artifact }}
    steps:
      - name: Checkout the same immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up runtime Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Linux validation tools
        run: |
          if [[ -f src/tg2cloud/version.py ]]; then
            sudo apt-get update
            sudo apt-get install -y shellcheck rclone
            python -m pip install -r requirements/dev.lock.txt
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck rclone
            python -m pip install -r payload_clouddrive2/requirements.txt ruff==0.16.0 bandit==1.9.4 pip-audit==2.10.1
            if [[ -f .github/requirements-test.txt ]]; then
              python -m pip install -r .github/requirements-test.txt
            fi
            # Only immutable historical tags may still need frozen desktop tests.
            if [[ -f legacy/desktop/requirements-build.txt ]]; then
              python -m pip install -r legacy/desktop/requirements-build.txt
            elif [[ -f requirements-build.txt ]]; then
              python -m pip install -r requirements-build.txt
            fi
          fi

      - name: ShellCheck
        run: |
          if [[ -f src/tg2cloud/version.py ]]; then
            bash -n install.sh
            bash -n install-lan.sh
            bash -n uninstall.sh
            shellcheck install.sh install-lan.sh uninstall.sh
            if [[ -f install-webdav.sh ]]; then
              bash -n install-webdav.sh
              shellcheck install-webdav.sh
            fi
            shellcheck -x packaging/hooks/clouddrive2/*.sh packaging/hooks/openlist/*.sh tests/manage_harness.sh tests/maintenance_docker_stub.sh
          else
            bash -n install.sh
            bash -n install-lan.sh
            bash -n uninstall.sh
            shellcheck install.sh install-lan.sh uninstall.sh
            shellcheck -x \
              payload_clouddrive2/backup_retention.sh \
              payload_clouddrive2/preserve_runtime_config.sh \
              payload_clouddrive2/remote_install.sh \
              payload_clouddrive2/repair_clouddrive_network.sh \
              payload_clouddrive2/manage.sh \
              payload_openlist/remote_install.sh \
              payload_openlist/manage.sh \
              payload_openlist/openlist_admin.sh \
              payload_openlist/preserve_webdav_config.sh \
              tests/manage_harness.sh \
              tests/maintenance_docker_stub.sh
          fi

      - name: Linux runtime, gateway and real WebDAV regression
        run: |
          if [[ -f src/tg2cloud/version.py ]]; then
            command -v bash shellcheck rclone docker
            docker info >/dev/null
            export PYTHONPATH=src
            python .github/scripts/check_python.py test
            python .github/scripts/check_python.py lint
            python .github/scripts/check_python.py compile
            python .github/scripts/prepare_bootstrap.py
            bandit -q -r src scripts .github/scripts/source_release.py
            pip-audit -r requirements/bot.lock.txt
            pip-audit -r requirements/dev.lock.txt
          else
            command -v bash shellcheck rclone docker
            docker info >/dev/null
            python .github/scripts/check_python.py test
            python .github/scripts/check_python.py lint --scope cli
            # Historical desktop entry points are launched with Python, not ./file.
            # Keep these exceptions here as well so retries can validate older tags.
            python -m ruff check . --extend-per-file-ignores 'installer.py:EXE001,installer_clouddrive2.py:EXE001,installer_openlist.py:EXE001'
            python .github/scripts/check_python.py compile
            bandit -q -r scripts payload_clouddrive2/app .github/scripts/source_release.py
            if [[ -f domain_proxy.py ]]; then
              bandit -q domain_proxy.py proxy_maintenance.py
            fi
            pip-audit -r payload_clouddrive2/requirements.txt
          fi

      - name: Validate edition Compose and build the runtime image
        run: |
          if [[ -f src/tg2cloud/version.py ]]; then
            python .github/scripts/build_payload.py --edition all --directory build/release-contexts
            touch build/release-contexts/clouddrive2/.env build/release-contexts/openlist/.env
            docker compose -f build/release-contexts/clouddrive2/docker-compose.yml config --quiet
            OPENLIST_ADMIN_PASSWORD=ci-only-placeholder docker compose -f build/release-contexts/openlist/docker-compose.yml config --quiet
            docker build -t tg2cloud-bot:release-test build/release-contexts/clouddrive2
          else
            touch payload_clouddrive2/.env
            docker compose -f payload_clouddrive2/docker-compose.yml config --quiet
            cp payload_clouddrive2/.env payload_openlist/.env
            OPENLIST_ADMIN_PASSWORD=ci-only-placeholder docker compose -f payload_openlist/docker-compose.yml config --quiet
            docker build -t tg2cloud-bot:release-test payload_clouddrive2
          fi

      - name: Run both Edition candidate images as non-root
        timeout-minutes: 20
        env:
          TG2CLOUD_TEST_DOCKER: "1"
        run: python -m unittest discover -s tests -p test_runtime_namespace.py -v

      - name: Isolated LAN Nginx checks (no product deployment)
        env:
          TG2CLOUD_TEST_LAN_DOCKER: "1"
        run: python -m unittest discover -s tests -p test_lan_gateway_docker.py -v

      - name: Isolated external WebDAV Nginx, authentication and Range
        if: hashFiles('install-webdav.sh') != ''
        env:
          TG2CLOUD_TEST_EXTERNAL_WEBDAV_DOCKER: "1"
        run: python -B -m unittest discover -s tests -p test_docker.py -v

      - name: Package immutable source once and verify bootstrap pins and SHA256
        run: python .github/scripts/source_release.py build --tag "${RELEASE_TAG}" --directory build/source-release

      - name: Upload validated source package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: |
            build/source-release/TG2Cloud-*-source.tar.gz
            build/source-release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    needs:
      - prepare
      - linux-validation
    if: >-
      needs.prepare.outputs.publish == 'true' &&
      needs.linux-validation.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
      RELEASE_ARTIFACT: ${{ needs.prepare.outputs.release_artifact }}
      RELEASE_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
    steps:
      - name: Checkout release notes from the immutable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download the validated Linux source artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: release-assets

      - name: Verify downloaded package without rebuilding
        run: python3 .github/scripts/source_release.py verify --tag "${RELEASE_TAG}" --directory release-assets

      - name: Create GitHub release from the same package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} appeared after preflight; refusing to replace it." >&2
            exit 1
          fi
          prerelease_args=()
          if [[ "${RELEASE_PRERELEASE}" == true ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            "release-assets/TG2Cloud-${RELEASE_TAG}-source.tar.gz" \
            release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${RELEASE_TITLE}" \
            --notes-file RELEASE_NOTES.md "${prerelease_args[@]}"

      - name: Verify published release and exact asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)" = "${RELEASE_TAG}"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json name --jq .name)" = "${RELEASE_TITLE}"
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq .isPrerelease)" = "${RELEASE_PRERELEASE}"
          expected=(
            SHA256SUMS.txt
            "TG2Cloud-${RELEASE_TAG}-source.tar.gz"
          )
          mapfile -t actual < <(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' | sort
          )
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url
