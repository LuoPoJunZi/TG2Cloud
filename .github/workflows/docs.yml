name: docs-quality

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "RELEASE_NOTES.md"
      - ".github/scripts/validate_release_notes.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "RELEASE_NOTES.md"
      - ".github/scripts/validate_release_notes.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Validate GitHub Release notes layout
        run: python .github/scripts/validate_release_notes.py RELEASE_NOTES.md
