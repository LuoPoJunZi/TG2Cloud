version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /packaging
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # Gateway manifests use docker-compose.<edition>.yml so the Compose scanner finds them.
  # The shared Bot image has its Dockerfile above; no duplicate Dockerfile is needed here.
  - package-ecosystem: docker-compose
    directory: /packaging/compose
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
