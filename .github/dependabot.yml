version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /payload_clouddrive2
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /payload_clouddrive2
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: /payload_openlist
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
