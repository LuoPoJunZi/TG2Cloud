services:
  clouddrive2:
    image: cloudnas/clouddrive2@sha256:b465ebea2de053b1dab3e8d7aae5450f557387e63aa74aa0ebc965f3f8614cd2
    container_name: tg2cloud-clouddrive2
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CLOUDDRIVE_HOME: /Config
    volumes:
      - ./clouddrive/config:/Config
      - ./clouddrive/mounts:/CloudNAS:shared
    ports:
      - "127.0.0.1:19798:19798"
    devices:
      - /dev/fuse:/dev/fuse
    privileged: true
    pid: host
    restart: unless-stopped
    networks:
      - tg2cloud-clouddrive2-net

  tg2cloud-clouddrive2-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg2cloud-clouddrive2-bot
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      LOG_DIR: /logs
      RCLONE_CONFIG_PATH: /config/rclone/rclone.conf
      TG2CLOUD_COMPOSE_SERVICE: tg2cloud-clouddrive2-bot
      TG115_COMPOSE_SERVICE: tg2cloud-clouddrive2-bot
    user: "10001:10001"
    volumes:
      - ./data:/data
      - ./downloads:/downloads
      - ./logs:/logs
      - ./config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
    networks:
      - tg2cloud-clouddrive2-net

networks:
  tg2cloud-clouddrive2-net:
    name: tg2cloud-clouddrive2-net
